; giomuadongbacv3: ONE active PlatformIO firmware (wall PID 4 cells).
; Existing other test source modules are retained for history, not selected.
; 96 MHz nominal RC2 HSI clock; MPU6050, 6-channel IR, encoder and JDY-33.
; VM/motor safety: physical PA0 START/STOP, one run after each reset.
; Default "pio run -t upload" now builds/uploads ONLY this firmware.

[env:wall_pid_4cell_96m]
platform = ststm32
board = genericSTM32F411CE
framework = cmsis
board_build.ldscript = ld/STM32F411CE_FLASH_256K.ld
board_upload.maximum_size = 262144
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_TIM11_TICK_SCHED=1
    -DMPU_TEMP_MONITOR=1
    -DWALL_PID_TEST_MODE=1
upload_protocol = stlink
upload_flags =
    -c
    adapter speed 100
    -c
    reset_config none
