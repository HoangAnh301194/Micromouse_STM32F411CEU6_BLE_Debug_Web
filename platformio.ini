[platformio]
default_envs = genericSTM32F411CE

[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
framework = cmsis
upload_protocol = stlink
upload_flags =
	-c
	adapter speed 100
	-c
	reset_config none

; HSI calibration experiment: tiny +1 trim step, motor-off diagnostic only.
; Use only with: python -m platformio run -e clock_hsi_trim17 -t upload
; Revert with: python -m platformio run -e genericSTM32F411CE -t upload
[env:clock_hsi_trim17]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=17

; Conservative stage-2 experiment: +1 HSI trim step compared with trim17.
; Do not extrapolate to higher trims or persist settings automatically.
[env:clock_hsi_trim18]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=18

; Conservative stage-3 test. One more trim step; keep the default unchanged.
; Verify CLOCK_TRIM active=19 in raw_serial.log before interpreting results.
[env:clock_hsi_trim19]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=19

; Single-step HSI characterization after verified trim19 (approx 97.2MHz SYSCLK).
; Opt-in debug mode only: STOP if host-estimated SYSCLK approaches 100MHz.
[env:clock_hsi_trim20]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=20
