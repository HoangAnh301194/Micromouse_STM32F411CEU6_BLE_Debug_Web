; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F411CE]
; Data sectors 6 and 7 are NOT part of the executable image.
board_build.ldscript = ld/STM32F411CE_FLASH_256K.ld
board_upload.maximum_size = 262144
platform = ststm32
board = genericSTM32F411CE
framework = cmsis
; Deliberately selected RC2 clock profile: nominal 96 MHz HSI trim25.
; PLLM=16 / PLLN=192 / PLLP=2; APB1=48MHz, APB2=96MHz.
; Nominal RCC math is not a frequency measurement; recheck on powered board.
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_TIM11_TICK_SCHED=1
    -DMPU_TEMP_MONITOR=1
upload_protocol = stlink
upload_flags =
	-c
	adapter speed 100
	-c
	reset_config none

; Opt-in 96MHz system integration capture. The default production env
; stays free of 1Hz instrumented diagnostic work. Motor Driver outputs
; are permanently locked until reset, even if BLE receives F/L/R.
[env:integration_diag_motor_off_96m]
extends = env:genericSTM32F411CE
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_TIM11_TICK_SCHED=1
    -DMPU_TEMP_MONITOR=1
    -DINTEGRATION_DIAG=1
    -DINTEGRATION_DIAG_MOTOR_OFF=1

; Controlled lifted-wheel motor-on benchmark, motor-off shadow same 33 stages.
; 0/10/20/.../100 percent, Left -> Right -> Both, 250ms drive+150ms coast.
; PA10 MODE ON then START over serial (no KEY); fresh calibrated gyro and 750ms host PING lease.
; Physical independent VM cutoff and proper fixture mandatory.
[env:integration_diag_motor_on_96m]
extends = env:genericSTM32F411CE
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_TIM11_TICK_SCHED=1
    -DMPU_TEMP_MONITOR=1
    -DINTEGRATION_DIAG=1
    -DINTEGRATION_DIAG_MOTOR_ON=1

; Separate motor-locked UART1 TX/RX throughput/CPU contention diagnostic.
; No UART rate generator in production or motor-on firmware; TXBENCH
; commands only accepted by this firmware environment.
[env:integration_diag_uart_96m]
extends = env:genericSTM32F411CE
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_TIM11_TICK_SCHED=1
    -DMPU_TEMP_MONITOR=1
    -DINTEGRATION_DIAG=1
    -DINTEGRATION_DIAG_MOTOR_OFF=1
    -DUART_PROFILE_DIAG=1

; Opt-in 50Hz encoder telemetry. Compiled MOTOR_OFF lock is mandatory.
[env:integration_diag_encoder_motor_off_96m]
extends = env:integration_diag_motor_off_96m
build_flags =
    ${env:integration_diag_motor_off_96m.build_flags}
    -DENCODER_PROFILE_DIAG=1
    -DENCODER_ALPHA_AB_DIAG=1

; Motor-ON encoder telemetry for the existing UART-authorized 33-stage sweep.
; Same watchdog/lease/fault-lock as integration_diag_motor_on_96m.
; Not enabled in production and never arms without MODE ON + START.
[env:integration_diag_encoder_motor_on_96m]
extends = env:integration_diag_motor_on_96m
build_flags =
    ${env:integration_diag_motor_on_96m.build_flags}
    -DENCODER_PROFILE_DIAG=1
    -DENCODER_ALPHA_AB_DIAG=1

; Low-PWM safety gate: motor is mechanically limited to 0-30% by compiled
; stage table, 4 stages per wheel group, 12 total (LEFT RIGHT BOTH).
; This profile cannot execute the ordinary 0-100% schedule.
[env:integration_diag_encoder_motor_on_limited_30_96m]
extends = env:integration_diag_encoder_motor_on_96m
build_flags =
    ${env:integration_diag_encoder_motor_on_96m.build_flags}
    -DINTEGRATION_DIAG_LIMITED_PWM_30=1

; Opt-in physical closed-loop speed PID A/B. Same fixed per-wheel gains,
; setpoints 0/800/1600/2400 PPS, hard 30% PWM clamp and 12-stage schedule.
; NO shadow EMA bank; only the named estimator alpha is changed.
; Production EMA alpha selected at 0.10 after 9/9 physical PID fixture PASS.
; Diagnostic override builds 0.08/0.10/0.30 stay unchanged for A/B regression.
[env:speed_pid_alpha_008_96m]
extends = env:integration_diag_motor_on_96m
build_flags =
    ${env:integration_diag_motor_on_96m.build_flags}
    -DINTEGRATION_DIAG_LIMITED_PWM_30=1
    -DENCODER_SPEED_PID_DIAG=1
    -DENCODER_PID_ALPHA_PCT=8

[env:speed_pid_alpha_010_96m]
extends = env:integration_diag_motor_on_96m
build_flags =
    ${env:integration_diag_motor_on_96m.build_flags}
    -DINTEGRATION_DIAG_LIMITED_PWM_30=1
    -DENCODER_SPEED_PID_DIAG=1
    -DENCODER_PID_ALPHA_PCT=10

[env:speed_pid_alpha_030_96m]
extends = env:integration_diag_motor_on_96m
build_flags =
    ${env:integration_diag_motor_on_96m.build_flags}
    -DINTEGRATION_DIAG_LIMITED_PWM_30=1
    -DENCODER_SPEED_PID_DIAG=1
    -DENCODER_PID_ALPHA_PCT=30

; Opt-in motor-locked map storage diagnostic, Flash write needs SAVE N CONFIRM.
[env:flash_map_diag_96m]
extends = env:genericSTM32F411CE
build_flags =
    ${env:genericSTM32F411CE.build_flags}
    -DFLASH_MAP_DIAG=1

; One-shot JDY-33 USART2 PA2/PA3 benchmark. No USART1 USB-TTL required.
; MOTOR OFF: output lock compiled in, all sensors and TIM11 continue.
[env:ble_profile_motor_off_115200_96m]
extends = env:integration_diag_motor_off_96m
build_flags =
    ${env:integration_diag_motor_off_96m.build_flags}
    -DBLE_PROFILE_DIAG=1

; A/B real BLE throughput with UART at 38400 baud (same sensor workload).
[env:ble_profile_motor_off_38400_96m]
extends = env:ble_profile_motor_off_115200_96m
build_flags =
    ${env:ble_profile_motor_off_115200_96m.build_flags}
    -DBT_BAUDRATE=38400

; Explicit opt-in guarded raised-wheel speed-PID with 30% PWM hard limit
; in existing speed_pid_diag + integration_sweep. ARM via BLE after cal.
; Host must send BLE PING <750ms; STM32 motor driver has 300ms lease.
[env:ble_profile_motor_on_pid_115200_96m]
extends = env:speed_pid_alpha_030_96m
build_flags =
    ${env:speed_pid_alpha_030_96m.build_flags}
    -DBLE_PROFILE_DIAG=1

; Isolated OLED + six-channel IR bench viewer, motor outputs locked.
; Uses existing TIM10/ADC1/DMA IR driver and SSD1306 on I2C1 PB8/PB9.
; Excludes production MPU6050, TIM11 control and BLE motion by design:
; SSD1306's current full-frame I2C write is blocking.
; Does not modify the default production build or flash data sectors.
[env:ir_oled_test_96m]
extends = env:genericSTM32F411CE
build_flags =
    ${env:genericSTM32F411CE.build_flags}
    -DIR_OLED_TEST=1

; Motor-locked OLED/MPU simultaneous I2C1 A/B diagnostic.
; Does not change production, IR-only OLED or motor-on environments.
[env:oled_mpu_diag_96m]
extends = env:genericSTM32F411CE
build_flags =
    ${env:genericSTM32F411CE.build_flags}
    -DOLED_MPU_DIAG=1
    -DOLED_SHARED_I2C=1

; Isolated JDY-33 RX A/B/C acceptance test — UART1 controls mode,
; USART2 is a BLE monitor/nonce echo, motors permanently locked.
; All A/B/C phases happen in ONE firmware, NO PID or Flash writes.
[env:ble_rx_diag_96m]
extends = env:genericSTM32F411CE
build_flags =
    ${env:genericSTM32F411CE.build_flags}
    -DBLE_RX_DIAG=1

; PA0-only (NO OLED) 90/180 IMU pivot and 200mm IMU/encoder test.
; Physical button release triggers one shot, subsequent press stops immediately.
; Modes cycle 90 -> 180 -> 200mm on SUCCESS only; PWM <=26%.
[env:system_test_96m]
extends = env:genericSTM32F411CE
build_flags =
    ${env:genericSTM32F411CE.build_flags}
    -DSYSTEM_TEST_MODE=1

; Opt-in gyro-only 90/180 turn PID qualification with 50Hz UART telemetry.
; No OLED; motor off except a physical PA0-initiated bounded test.
; UART selects 90/180 and BASE/FAST only while motors locked (never starts).
[env:turn_pid_diag_96m]
extends = env:genericSTM32F411CE
build_flags =
    ${env:genericSTM32F411CE.build_flags}
    -DTURN_PID_DIAG=1
