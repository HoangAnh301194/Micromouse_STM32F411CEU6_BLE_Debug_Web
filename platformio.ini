[platformio]
default_envs = genericSTM32F411CE

[env:genericSTM32F411CE]
platform = ststm32
board = genericSTM32F411CE
framework = cmsis
upload_protocol = stlink
upload_flags =
	-c
	adapter speed 100
	-c
	reset_config none

; HSI calibration experiment: tiny +1 trim step, motor-off diagnostic only.
; Use only with: python -m platformio run -e clock_hsi_trim17 -t upload
; Revert with: python -m platformio run -e genericSTM32F411CE -t upload
[env:clock_hsi_trim17]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=17

; Conservative stage-2 experiment: +1 HSI trim step compared with trim17.
; Do not extrapolate to higher trims or persist settings automatically.
[env:clock_hsi_trim18]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=18

; Conservative stage-3 test. One more trim step; keep the default unchanged.
; Verify CLOCK_TRIM active=19 in raw_serial.log before interpreting results.
[env:clock_hsi_trim19]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=19

; Single-step HSI characterization after verified trim19 (approx 97.2MHz SYSCLK).
; Opt-in debug mode only: STOP if host-estimated SYSCLK approaches 100MHz.
[env:clock_hsi_trim20]
extends = env:genericSTM32F411CE
build_flags = -DCLOCK_HSI_TRIM=20

; Isolated 96 MHz NOMINAL clock validation using calibrated HSI trim25.
; This is NOT a production profile; current main.c keeps all motors disabled.
; PLLM=16, PLLN=192, PLLP=2; APB1 /2; APB2 /1.
; Expected SYSCLK based on 80MHz host survey: ~95.857 MHz, to be measured.
[env:clock_96m_trim25]
extends = env:genericSTM32F411CE
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25

; Isolated MPU6050 DATA_RDY vs TIM11 snapshot-age diagnostic.
; Reuses validated nominal 96MHz PLLN192/HSITRIM25. All motors remain OFF.
; Does not modify the normal/default 100MHz environment.
[env:imu_freshness_96m_trim25]
extends = env:clock_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_FRESHNESS_DIAG=1

; A/B sensor sampling experiment:
; A = existing imu_freshness_96m_trim25 (read gyro even when DATA_RDY=0)
; B = skip gyro on DATA_RDY=0; one TIM5-CC1-woken retry after 220us,
;     abandoned if it would exceed the current nominal 1ms slot.
; Both use isolated motor-OFF diagnostics and nominal 96MHz PLLN192 trim25.
[env:imu_freshness_ab_b_96m_trim25]
extends = env:imu_freshness_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_FRESHNESS_DIAG=1
    -DMPU_FRESHNESS_AB_B=1

; Opt-in benchmark: TIM11 ISR stage 0 -> encoder -> encoder+PID.
; Motor_Init and PWM are never called. Do not substitute this for motor tests.
[env:control_load_diag_96m_trim25]
extends = env:imu_freshness_ab_b_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_FRESHNESS_DIAG=1
    -DMPU_FRESHNESS_AB_B=1
    -DCONTROL_LOAD_DIAG=1

; Comparator for staged ISR test: same firmware/clock/MPU/PID workload.
; Only stagger 1Hz LOAD log 200ms after the bulk diagnostic output,
; to test whether synchronized UART formatting is responsible for gyro reuse.
[env:control_load_staggered_96m_trim25]
extends = env:control_load_diag_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_FRESHNESS_DIAG=1
    -DMPU_FRESHNESS_AB_B=1
    -DCONTROL_LOAD_DIAG=1
    -DCONTROL_LOAD_LOG_STAGGER=1

; MPU/I2C integration candidate, motor OFF. Distinct from the frozen RC1
; diagnostic environment and independent from MPU_FRESHNESS_DIAG.
[env:mpu_integration_policy_b_96m_trim25]
extends = env:clock_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_INTEGRATION_BENCH=1

; Paired measurement experiment, motor OFF. SAME MPU policy, clock,
; TIM11 and background main work; compares raw I2C IRQ completion vs
; snapshot publication in each TIM11 tick, with bounded 5-second UART.
; Do not use for motor tests and do not overwrite the integrated baseline.
[env:mpu_phase_ab_96m_trim25]
extends = env:clock_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_INTEGRATION_BENCH=1
    -DMPU_PHASE_AB=1

; Controlled scheduler experiment: same phase telemetry and Policy B as
; mpu_phase_ab_96m_trim25, but one request opportunity per TIM11 tick.
; TIM11 ONLY timestamps/sets a sequence, I2C transactions remain in main.
; This build is motor OFF, NOT a production scheduler until A/B verified.
[env:mpu_phase_tick_96m_trim25]
extends = env:clock_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_INTEGRATION_BENCH=1
    -DMPU_PHASE_AB=1
    -DMPU_TIM11_TICK_SCHED=1

; Physical Motor Driver baseline capture. EXACTLY one opt-in app:
; manually KEY-armed <=12% PWM, <=200ms pulses, 30kHz TIM2, TIM11=1kHz.
; No MPU, IR, BLE or Motion in this profile. NOT current-limited.
; Do NOT substitute this build for MPU RC2 or default firmware.
[env:motor_pwm_key_bench_96m_trim25]
extends = env:clock_96m_trim25
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMOTOR_PWM_DIAG=1
