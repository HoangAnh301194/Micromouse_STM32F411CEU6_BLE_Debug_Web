; Unified operating firmware. Historical isolated builds: platformio_v5_diagnostics.ini
[platformio]
default_envs = micromouse_96m

[env:micromouse_96m]
; Data sectors 6 and 7 are NOT part of the executable image.
board_build.ldscript = ld/STM32F411CE_FLASH_256K.ld
board_upload.maximum_size = 262144
platform = ststm32
board = genericSTM32F411CE
framework = cmsis
; Deliberately selected RC2 clock profile: nominal 96 MHz HSI trim25.
; PLLM=16 / PLLN=192 / PLLP=2; APB1=48MHz, APB2=96MHz.
; Nominal RCC math is not a frequency measurement; recheck on powered board.
build_flags =
    -DCLOCK_VALIDATE_96M=1
    -DCLOCK_HSI_TRIM=25
    -DMPU_SAMPLING_POLICY_B=1
    -DMPU_TIM11_TICK_SCHED=1
    -DMPU_TEMP_MONITOR=1
    -DOLED_SHARED_I2C=1
    -DMICROMOUSE_UNIFIED_RUNTIME=1
    ; Transitional compatibility flags: menu scheduler + guarded OneBox runner.
    -DMODE_MENU_ONLY=1
    -DENCODER_1BOX_TEST_MODE=1
upload_protocol = stlink
upload_flags =
	-c
	adapter speed 100
	-c
	reset_config none

