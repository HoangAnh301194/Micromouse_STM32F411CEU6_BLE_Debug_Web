name: Clock 96MHz HSI trim25 - Motor MPU UART integration
on:
  push:
    branches:
      - integration/clock-96m-trim25-giomuadongbac
      - giomuadongbac
    paths:
      - '.github/workflows/clock96-giomuadongbac.yml'
      - 'platformio.ini'
      - 'include/board.h'
      - 'include/control.h'
      - 'include/pinout.h'
      - 'src/board.c'
      - 'src/main.c'
      - 'src/control.c'
      - 'src/system_timer.c'
      - 'src/motor.c'
      - 'src/uart.c'
      - 'src/bt_debug.c'
      - 'src/i2c.c'
      - 'tools/clock96_integration_gate.py'
      - 'docs/clock/**'
  pull_request:
    branches: [giomuadongbac]
  workflow_dispatch:

jobs:
  default-96m-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate RC2 clock source, 96MHz dividers, fail-closed boot and 10 mutations
        run: |
          python tools/clock96_integration_gate.py --self-test
          python tools/clock96_integration_gate.py --audit
      - name: Recheck USART1 and MPU/I2C RC2 integration
        run: python tools/uart_mpu_integration_gate.py
      - name: Recheck frozen Motor Driver with RC2 scheduler
        run: |
          python tools/motor_giomuadongbac_gate.py --self-test
          python tools/motor_giomuadongbac_gate.py --audit
          python tools/motor_driver_native_test.py
      - name: Build default STM32F411 firmware with 96MHz trim25 (NO FLASH)
        run: |
          python -m pip install --disable-pip-version-check platformio
          python -m platformio run -e genericSTM32F411CE
