name: USART1 Debug and MPU6050 I2C RC2 Integration
on:
  push:
    branches:
      - integration/uart1-mpu6050-rc2-giomuadongbac
      - giomuadongbac
    paths:
      - '.github/workflows/uart-mpu-rc2-giomuadongbac.yml'
      - 'src/uart.c'
      - 'include/uart.h'
      - 'src/i2c.c'
      - 'include/i2c.h'
      - 'src/mpu6050.c'
      - 'include/mpu6050.h'
      - 'include/mpu_policy.h'
      - 'src/system_timer.c'
      - 'include/system_timer.h'
      - 'src/main.c'
      - 'src/control.c'
      - 'platformio.ini'
      - 'tools/uart_mpu_rc2_integration_gate.py'
  pull_request:
    branches: [giomuadongbac]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen RC2 and Motor blobs and source integration
        run: |
          python tools/uart_mpu_rc2_integration_gate.py --self-test
          python tools/uart_mpu_rc2_integration_gate.py --audit
      - name: Confirm frozen Motor native API and watchdog regressions
        run: python tools/motor_driver_native_test.py
      - name: Verify original Motor transplant contract preserved
        run: |
          python tools/motor_giomuadongbac_gate.py --self-test
          python tools/motor_giomuadongbac_gate.py --audit
      - name: Build production STM32F411 with MPU RC2 and UART1 RX enabled, no flash
        run: |
          python -m pip install --disable-pip-version-check platformio
          python -m platformio run -e genericSTM32F411CE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Re-run integration negative tests on Python 3.14
        run: |
          python tools/uart_mpu_rc2_integration_gate.py --self-test
          python tools/uart_mpu_rc2_integration_gate.py --audit
