name: UART1 plus MPU RC2 integration
on:
  push:
    branches:
      - integration/uart1-mpu-rc2-giomuadongbac
      - giomuadongbac
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'tools/uart_mpu_integration_gate.py'
      - '.github/workflows/uart-mpu-integration.yml'
  pull_request:
    branches: [giomuadongbac]
  workflow_dispatch:
jobs:
  integrate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/uart_mpu_integration_gate.py
      - run: python tools/motor_driver_native_test.py
      - name: Compile integrated firmware (no flash)
        run: |
          python -m pip install --disable-pip-version-check platformio
          python -m platformio run -e genericSTM32F411CE
