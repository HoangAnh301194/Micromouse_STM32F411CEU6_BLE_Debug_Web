name: giomuadongbacv2 safe menu + System Test
on:
  push:
    branches: [giomuadongbacv2]
    paths:
      - 'src/mode_menu.c'
      - 'include/mode_menu.h'
      - 'include/mode_test_resources.h'
      - 'src/mode_test_resources.c'
      - 'src/main_runtime.c'
      - 'src/encoder_onebox.c'
      - 'src/encoder_onebox_core.c'
      - 'include/encoder_onebox.h'
      - 'include/encoder_onebox_core.h'
      - 'include/motor.h'
      - 'src/motor.c'
      - 'tests/regression/encoder_onebox_native_test.py'
      - 'src/main.c'
      - 'src/spp_smoke.c'
      - 'platformio.ini'
      - 'tools/classic_spp_smoke_probe.py'
      - 'src/control.c'
      - 'include/control.h'
      - 'tools/classic_spp_dashboard.py'
      - 'tools/classic_spp_handshake.py'
      - 'tools/spp_dual_log.py'
      - 'tests/regression/mode_menu_native_test.py'
      - 'tests/regression/spp_dual_log_test.py'
      - 'tests/regression/spp_handshake_test.py'
      - '.github/workflows/giomuadongbacv2-menu-test.yml'
  workflow_dispatch:
jobs:
  menu-native-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native menu state machine and CSV tests
        run: |
          python tests/regression/mode_menu_native_test.py
          python tests/regression/encoder_onebox_native_test.py
          python tests/regression/spp_dual_log_test.py
          python tests/regression/spp_handshake_test.py
      - name: Python syntax for SPP dashboard
        run: |
          python -m py_compile tools/classic_spp_dashboard.py tools/classic_spp_handshake.py tools/spp_dual_log.py tools/classic_spp_smoke_probe.py
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Compile unified menu firmware with guarded one-box
        run: python -m platformio run -e mode_menu_96m
      - name: Compile default VS Code Upload image (unified firmware)
        run: |
          python -c "import configparser; c=configparser.ConfigParser(interpolation=None); c.read('platformio.ini'); assert c['platformio']['default_envs'].strip() == 'mode_menu_96m'"
          python -m platformio run
      - name: Compile compatible legacy 1-box profile alias
        run: python -m platformio run -e encoder_1box_96m
      - name: Compile isolated motor-locked SPP smoke firmware
        run: python -m platformio run -e spp_smoke_96m
