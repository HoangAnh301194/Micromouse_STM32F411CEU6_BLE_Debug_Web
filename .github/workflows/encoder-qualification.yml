name: Encoder unified qualification (host only)
on:
  push:
    branches: [giomuadongbac]
    paths:
      - "src/encoder.c"
      - "src/speed_pid_diag.c"
      - "src/pid.c"
      - "include/speed_pid_diag.h"
      - "tests/speed_pid/**"
      - "tools/speed_pid*.py"
      - "tools/test_speed_pid*.py"
      - "src/integration_sweep.c"
      - "src/integration_serial.c"
      - "include/integration_sweep.h"
      - "tools/system_integration_gate.py"
      - "src/i2c.c"
      - "include/i2c.h"
      - "tools/test_encoder_shadow_ab.py"
      - "src/main.c"
      - "include/encoder.h"
      - "src/control.c"
      - "platformio.ini"
      - "tools/encoder_*.py"
      - "tools/test_encoder_*.py"
      - "tools/system_uart_pipeline.py"
      - "src/uart.c"
      - "tests/encoder/**"
      - ".github/workflows/encoder-qualification.yml"
  workflow_dispatch:

jobs:
  encoder-native-and-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Native, simulator, and locked diagnostic firmware build (no hardware)
        run: python tools/encoder_qualification_pipeline.py --mode offline
      - name: Test P0-P3 orchestrator offline and compile capped firmware
        run: |
          python tools/test_encoder_p0_p3_pipeline.py
          python tools/encoder_p0_p3_pipeline.py --offline-only
      - name: Native closed-loop PID tests and three isolated alpha builds
        run: python tools/speed_pid_final_pipeline.py --offline-only
      - name: Verify production firmware still builds
        run: python -m platformio run -e genericSTM32F411CE
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encoder-offline-qualification
          path: results/encoder_qual_*/
          if-no-files-found: warn
