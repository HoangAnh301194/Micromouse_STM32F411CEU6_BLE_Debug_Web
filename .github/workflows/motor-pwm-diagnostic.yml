name: Motor PWM Diagnostic Build and Host Gate
on:
  push:
    branches:
      - feature/motor-driver-optimization
    paths:
      - '.github/workflows/motor-pwm-diagnostic.yml'
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'tools/motor_pwm_capture.py'
      - 'tools/motor_auto_pipeline.py'
      - 'tools/motor_full_qualification.py'
      - 'tools/motor_stop_truth_table_audit.py'
      - 'tools/motor_stop_transition_regression.py'
      - 'tools/motor_p0_batch_pipeline.py'
      - 'tools/motor_functional_trace_pipeline.py'
      - 'tools/motor_driver_native_test.py'
      - 'tools/motor_driver_probe.py'
      - 'tools/motor_driver_debug_pipeline.py'
      - 'tools/motor_driver_metrics.py'
      - 'tools/motor_startup_pipeline.py'
      - 'tests/motor_driver/**'
      - 'docs/motor_driver/**'
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Host-side strict UART capture regression
        run: python tools/motor_pwm_capture.py --self-test
      - name: Compile and execute actual motor driver with host register mocks
        run: python tools/motor_driver_native_test.py
      - name: Locked neutral driver UART probe self-test
        run: python tools/motor_driver_probe.py --self-test
      - name: Unified Motor Driver checklist, metrics and hardware-access guards
        run: python tools/motor_driver_debug_pipeline.py --self-test
      - name: Bounded startup encoder pipeline regression
        run: python tools/motor_startup_pipeline.py --self-test
      - name: Compile isolated bounded startup bench
        run: python -m platformio run -e motor_startup_96m_trim25
      - name: Compile explicit KEY-armed motor bench
        run: python -m platformio run -e motor_pwm_key_bench_96m_trim25
      - name: Three-round serial host pipeline parser self-test
        run: python tools/motor_auto_pipeline.py --self-test
      - name: Compile integrated serial-host-armed 3x21 motor suite
        run: python -m platformio run -e motor_auto_pipeline_96m_trim25
      - name: Extended high PWM (30-60 percent) parser self-test
        run: python tools/motor_auto_pipeline.py --self-test --high-pwm
      - name: Compile opt-in 3x29 high PWM bench
        run: python -m platformio run -e motor_auto_high_96m_trim25
      - name: v7 integrated motor MPU IR host parser self-test
        run: python tools/motor_auto_pipeline.py --self-test --sensor-integration
      - name: v7 integrated motor MPU IR firmware compile
        run: python -m platformio run -e motor_auto_sensor_96m_trim25
      - name: v8 high motor MPU IR host parser self-test
        run: python tools/motor_auto_pipeline.py --self-test --sensor-integration --high-pwm
      - name: v8 high motor MPU IR firmware compile
        run: python -m platformio run -e motor_auto_sensor_high_96m_trim25
      - name: STOP / coast / brake Toshiba truth-table and source regression (no motors)
        run: python tools/motor_stop_truth_table_audit.py --self-test
      - name: STOP / coast / brake source audit reports settled Hi-Z source
        run: python tools/motor_stop_truth_table_audit.py
      - name: No-power STOP/drive/reverse/brake transition and preload regression
        run: python tools/motor_stop_transition_regression.py
      - name: 512-tick SRAM/UART idle functional trace parser and fail-closed source gates
        run: python tools/motor_functional_trace_pipeline.py --self-test
      - name: Multi-gate P0 batch + synthetic scope negative tests (no motors)
        run: python tools/motor_p0_batch_pipeline.py --self-test
      - name: P0 one-command report (hardware capture remains NOT_MEASURED)
        run: python tools/motor_p0_batch_pipeline.py --run --output "$RUNNER_TEMP/motor-p0-batch"
      - name: Unified Motor Driver debug report (no hardware)
        run: python tools/motor_driver_debug_pipeline.py --run --output "$RUNNER_TEMP/motor-driver-debug"
      - name: Archive unified Motor Driver checklist report
        uses: actions/upload-artifact@v4
        with:
          name: motor-driver-debug-no-hardware
          path: ${{ runner.temp }}/motor-driver-debug/
          if-no-files-found: error
      - name: Archive source-only P0 qualification report
        uses: actions/upload-artifact@v4
        with:
          name: motor-p0-batch-no-hardware
          path: ${{ runner.temp }}/motor-p0-batch/
          if-no-files-found: error
      - name: Unified five-gate high-speed qualification self-test (never powers motors)
        run: python tools/motor_full_qualification.py --self-test
      - name: Unified full qualification offline audit (prior log can be absent on CI checkout)
        run: python tools/motor_full_qualification.py --audit
      - name: Powered qualification entrypoint must fail closed before any flash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, "tools/motor_full_qualification.py",
               "--run-integrated", "--vm-state", "powered",
               "--confirm-wheels-elevated"],
              capture_output=True, text=True, check=False
          )
          assert result.returncode == 2, (result.returncode, result.stdout, result.stderr)
          assert "P0 SAFETY GATE" in result.stderr, result.stderr
          print("PASS: powered qualification refused before hardware access.")
          PY
      - name: Compile unchanged MPU RC2 comparator
        run: python -m platformio run -e mpu_phase_tick_96m_trim25
      - name: Install Python 3.14 for Windows-compatible argparse behavior regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python 3.14 no-drive 1kHz functional trace regression
        run: python tools/motor_functional_trace_pipeline.py --self-test
      - name: Python 3.14 unified Motor Driver debug pipeline regression
        run: python tools/motor_driver_debug_pipeline.py --self-test
      - name: Python 3.14 bounded startup encoder pipeline regression
        run: python tools/motor_startup_pipeline.py --self-test
      - name: Python 3.14 P0 multi-gate host regression
        run: python tools/motor_p0_batch_pipeline.py --self-test
      - name: Python 3.14 STOP truth-table CLI self-test
        run: python tools/motor_stop_truth_table_audit.py --self-test
      - name: Python 3.14 no-power STOP transition regression
        run: python tools/motor_stop_transition_regression.py
      - name: Python 3.14 CLI --help smoke test (rejects bad percent formatting)
        run: python tools/motor_full_qualification.py --help
      - name: Python 3.14 non-powered audit smoke test
        run: python tools/motor_full_qualification.py --audit
      - name: Python 3.14 full qualification self-test
        run: python tools/motor_full_qualification.py --self-test
