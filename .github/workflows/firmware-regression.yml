name: Production firmware and regression tests
on:
  push:
    branches: [giomuadongbac]
    paths: ["src/**", "include/**", "ld/**", "platformio.ini", "web/**", "tests/**", "tools/flash_map_pipeline.py", "tools/oled_mpu_pipeline.py", "tools/encoder_qualification_pipeline.py", "tools/system_integration_gate.py", "tools/turn_pid_pipeline.py", "tools/test_turn_pid_pipeline.py", "tools/ir_filter_pipeline.py", "tools/test_ir_filter_pipeline.py", "tools/ir_full_qualification.py", ".github/workflows/firmware-regression.yml"]
  pull_request:
    branches: [giomuadongbac]
  workflow_dispatch:
jobs:
  production-and-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Native regression for Encoder, IR, motor, Flash and BLE web
        run: |
          python tests/regression/encoder_native_test.py
          python tests/regression/ir_sensor_native_test.py
          python tests/regression/motor_driver_native_test.py
          python tests/regression/system_sweep_native_test.py
          python tests/regression/flash_record_native_test.py
          python tests/regression/flash_map_protocol_test.py
          node tests/web/test_ble_map_web.js
          node tests/web/test_flash_map_gatt_control.js
          python tools/test_ble_rx_qualification.py
      - name: Native six-channel IR filtering and capture format regression
        run: |
          python tests/regression/ir_filter_native_test.py
          python tools/test_ir_filter_pipeline.py
          python tests/regression/ir_full_qualification_test.py
      - name: Native modular motion primitive tests (left/right 90 and 180, fault paths)
        run: python tests/regression/motion_primitives_native_test.py
      - name: Verify canonical tools after OLED handover
        run: |
          python - <<'PY'
          from pathlib import Path
          retired = (
              "tools/ble_debug_console.html",
              "tools/test_ble_map_web.js",
              "tools/encoder_native_test.py",
              "tools/flash_record_native_test.py",
              "tools/ir_sensor_native_test.py",
              "tools/motor_driver_native_test.py",
              "tools/system_sweep_native_test.py",
              "tools/test_flash_map_protocol.py",
          )
          canonical = (
              "web/ble_debug_console.html",
              "tests/web/test_ble_map_web.js",
              "tests/regression/encoder_native_test.py",
              "tests/regression/flash_record_native_test.py",
              "tests/regression/ir_sensor_native_test.py",
              "tests/regression/motor_driver_native_test.py",
              "tests/regression/system_sweep_native_test.py",
              "tests/regression/flash_map_protocol_test.py",
              "tools/oled_mpu_pipeline.py",
              "results/oled_mpu_20261024_082616/report.json",
          )
          assert not [x for x in retired if Path(x).exists()], "Obsolete duplicate files remain"
          assert all(Path(x).is_file() for x in canonical), "Canonical test or OLED evidence missing"
          for dependent in ("tools/encoder_qualification_pipeline.py",
                            "tools/system_integration_gate.py"):
              assert "tests/regression/" in Path(dependent).read_text()
          print("HANDOVER_LAYOUT_PASS (not a substitute for live hardware validation)")
          PY
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Build production firmware (no hardware)
        run: python -m platformio run -e genericSTM32F411CE
      - name: Build isolated motor-locked IR filter capture firmware (no hardware)
        run: python -m platformio run -e ir_filter_diag_96m
      - name: Build PA0 motor-locked rolling IR burst firmware (no hardware)
        run: python -m platformio run -e ir_burst_diag_96m
      - name: Build six-sensor IR OLED test firmware (no hardware)
        run: python -m platformio run -e ir_oled_test_96m
      - name: Test OLED-MPU host parser and verdict (synthetic)
        run: python tools/oled_mpu_pipeline.py --self-test
      - name: Build motor-locked OLED MPU diagnostic (no hardware)
        run: python -m platformio run -e oled_mpu_diag_96m
      - name: Build optional motor-locked Flash-map firmware (no hardware)
        run: python -m platformio run -e flash_map_diag_96m
      - name: Build motor-locked JDY-33 RX A/B/C qualification image (no hardware)
        run: python -m platformio run -e ble_rx_diag_96m

      - name: Build headless PA0 system-test firmware (no physical test)
        run: python -m platformio run -e system_test_96m
      - name: Native synthetic 90/180 turn trace parser/metric tests
        run: python tools/test_turn_pid_pipeline.py
      - name: Build gyro 90/180 PID qualification firmware (no hardware)
        run: python -m platformio run -e turn_pid_diag_96m
