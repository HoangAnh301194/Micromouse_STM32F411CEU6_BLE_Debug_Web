name: v3 unified firmware and host regression
on:
  push:
    branches: [giomuadongbacv3]
  pull_request:
    branches: [giomuadongbacv3]
  workflow_dispatch:
jobs:
  v3-native-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q tools tests/regression
      - name: Native and protocol tests
        run: |
          python tests/regression/encoder_native_test.py
          python tests/regression/encoder_onebox_native_test.py
          python tests/regression/mode_menu_native_test.py
          python tests/regression/spp_dual_log_test.py
          python tests/regression/motor_driver_native_test.py
          python tools/test_onebox_audit.py
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Build default guarded runtime (no hardware)
        run: python -m platformio run -e mode_menu_96m
      - name: Build opt-in OLED diagnostic (no hardware)
        run: python -m platformio run -e mode_menu_oled_diag_96m
