name: MPU I2C integration regression

on:
  push:
    branches:
      - feature/mpu-i2c-integration-rc1
      - feature/mpu-freshness-phase-ab
  pull_request:
    paths:
      - 'src/mpu6050.c'
      - 'include/mpu6050.h'
      - 'include/mpu_policy.h'
      - 'src/control.c'
      - 'src/system_timer.c'
      - 'include/system_timer.h'
      - 'src/mpu_integration_bench.c'
      - 'src/i2c.c'
      - 'include/i2c.h'
      - 'tools/mpu_phase_ab_analyze.py'
      - 'platformio.ini'
      - 'tools/mpu_integration_regression.py'

jobs:
  build-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: python -m pip install --upgrade platformio
      - name: Check static integration contract
        run: python tools/mpu_integration_regression.py --source-check
      - name: Host regression self-tests
        run: |
          python tools/mpu_integration_regression.py --self-test
          python tools/imu_freshness_analyze.py --self-test
      - name: Build validated RC1 legacy diagnostic
        run: python -m platformio run -e control_load_staggered_96m_trim25
      - name: Build no-diagnostic Policy B integration
        run: python -m platformio run -e mpu_integration_policy_b_96m_trim25
      - name: Phase A/B synthetic regression
        run: python tools/mpu_phase_ab_analyze.py --self-test
      - name: Build matched IRQ-vs-publication phase trace
        run: python -m platformio run -e mpu_phase_ab_96m_trim25
