name: System 96MHz Motor ON OFF integration debug
on:
  push:
    branches:
      - integration/system-debug-96m-20261017
      - giomuadongbac
    paths:
      - '.github/workflows/system-integration-96m.yml'
      - 'platformio.ini'
      - 'include/**'
      - 'src/**'
      - 'tests/integration/**'
      - 'tools/system_integration_gate.py'
      - 'tools/system_uart_pipeline.py'
      - 'tools/test_system_uart_pipeline.py'
      - 'tools/uart_rate_benchmark.py'
      - 'tools/test_uart_rate_benchmark.py'
      - 'tools/flash_map_pipeline.py'
      - 'tools/test_flash_map_protocol.py'
      - 'tools/test_ble_map_web.js'
      - 'tools/ble_debug_console.html'
      - 'src/uart_bench.c'
      - 'include/uart_bench.h'
      - 'src/uart.c'
      - 'include/uart.h'
      - 'tools/system_sweep_native_test.py'
      - 'docs/system_debug/**'
      - 'include/encoder.h'
  pull_request:
    branches: [giomuadongbac]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit mutually exclusive ON OFF gates and 33 steps
        run: python tools/system_integration_gate.py --audit
      - name: Run negative mutation integration guards
        run: python tools/system_integration_gate.py --self-test
      - name: Native Motor Driver regression
        run: python tools/system_integration_gate.py --native-test
      - name: Native 145s motor OFF and ON C state machine fault injections
        run: python tools/system_sweep_native_test.py
      - name: Host serial parser synthetic regression
        run: python tools/test_system_uart_pipeline.py
      - name: UART PA9/PA10 rate profile offline analysis and CLI
        run: python tools/test_uart_rate_benchmark.py
      - name: Regression clock and RC2 UART MPU
        run: |
          python tools/clock96_integration_gate.py --self-test
          python tools/clock96_integration_gate.py --audit
          python tools/uart_mpu_integration_gate.py
      - name: Regression frozen Motor Driver and TIM11 contract
        run: |
          python tools/motor_giomuadongbac_gate.py --self-test
          python tools/motor_giomuadongbac_gate.py --audit
          python tools/motor_driver_native_test.py
      - name: Native Flash CRC and reserved-sector contract regression
        run: python tools/flash_record_native_test.py
      - name: Native C map 5x5/16x16 and UART frame regression
        run: python tools/test_flash_map_protocol.py
      - name: Browser JavaScript map resize and CRC regression
        run: node tools/test_ble_map_web.js
      - name: Build opt-in locked map Flash diagnostic
        run: |
          python -m pip install --disable-pip-version-check platformio
          python -m platformio run -e flash_map_diag_96m
      - name: Build default production firmware (Flash API inactive)
        run: |
          python -m pip install --disable-pip-version-check platformio
          python -m platformio run -e genericSTM32F411CE
      - name: Build motor OFF shadow integration firmware (Flash API inactive)
        run: python -m platformio run -e integration_diag_motor_off_96m
      - name: Build motor ON 0-100 percent integration firmware (Flash API inactive)
        run: python -m platformio run -e integration_diag_motor_on_96m
      - name: Build motor-locked UART throughput profiler (NO FLASH)
        run: python -m platformio run -e integration_diag_uart_96m
